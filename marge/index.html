<title>Marge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,300,0..1,0&display=block">
<style>
/* ===== Marge · tokens ===== */
:root{
  color-scheme:light;
  /* 60 % : le blanc. Neutre froid très légèrement bleuté (teinte 279, chroma < 2), pour qu'il paraisse propre sans virer au gris ni au crème */
  --surface:#fbfbfc;
  --on-surface:#1b1b1f;
  --on-surface-variant:#46464c;
  /* 30 % : les nuances de blanc et de gris (surface-container-*) */
  --sc-lowest:#ffffff;
  --sc-low:#f6f6f8;
  --sc:#f1f1f3;
  --sc-high:#ebebee;
  --sc-highest:#e4e4e8;
  --outline:#77767d;
  --outline-variant:#c7c5cd;
  /* 10 % : bleu cobalt, l'encre du stylo qui annote dans la marge */
  --primary:#3850d3;
  --on-primary:#ffffff;
  --primary-container:#dee0ff;
  --on-primary-container:#1834bb;
  --inverse-surface:#313031;
  --inverse-on-surface:#f3f0f1;
  --inverse-primary:#bbc3ff;
  --error:#ba1a1a;
  --on-error:#ffffff;
  --scrim:#000;

  --font-brand:"Newsreader",Georgia,"Times New Roman",serif;
  --font-plain:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-xs:4px; --r-s:8px;
  --ease:cubic-bezier(.2,0,0,1);
  --ease-dec:cubic-bezier(.05,.7,.1,1);
  --ease-acc:cubic-bezier(.3,0,.8,.15);
  --ease-spring:cubic-bezier(.38,1.21,.22,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --surface:#131314; --on-surface:#e5e1e3; --on-surface-variant:#c7c5cd;
    --sc-lowest:#0e0e0f; --sc-low:#1c1b1c; --sc:#201f20; --sc-high:#2a2a2b; --sc-highest:#353435;
    --outline:#919097; --outline-variant:#46464c;
    --primary:#bbc3ff; --on-primary:#001e92; --primary-container:#1834bb; --on-primary-container:#dee0ff;
    --inverse-surface:#e5e1e3; --inverse-on-surface:#313031; --inverse-primary:#3850d3;
    --error:#ffb4ab; --on-error:#690005;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface:#131314; --on-surface:#e5e1e3; --on-surface-variant:#c7c5cd;
  --sc-lowest:#0e0e0f; --sc-low:#1c1b1c; --sc:#201f20; --sc-high:#2a2a2b; --sc-highest:#353435;
  --outline:#919097; --outline-variant:#46464c;
  --primary:#bbc3ff; --on-primary:#001e92; --primary-container:#1834bb; --on-primary-container:#dee0ff;
  --inverse-surface:#e5e1e3; --inverse-on-surface:#313031; --inverse-primary:#3850d3;
  --error:#ffb4ab; --on-error:#690005;
}

/* ===== Base ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--surface);color:var(--on-surface);font:400 16px/24px var(--font-plain);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums lining-nums}

/* Type : brand = Newsreader (titres, chiffres de lecture, citations), plain = Instrument Sans (interface) */
.display{font:400 57px/64px var(--font-brand);letter-spacing:-.5px;font-variation-settings:"opsz" 72}
.headline-l{font:400 32px/40px var(--font-brand);letter-spacing:-.25px;font-variation-settings:"opsz" 48}
.headline-s{font:400 24px/32px var(--font-brand);font-variation-settings:"opsz" 30}
.title-l{font:500 22px/28px var(--font-brand);font-variation-settings:"opsz" 24}
.title-m{font:600 16px/24px var(--font-plain);letter-spacing:.1px}
.body-l{font:400 16px/24px var(--font-plain)}
.body-m{font:400 14px/20px var(--font-plain);letter-spacing:.1px}
.label-l{font:500 14px/20px var(--font-plain);letter-spacing:.1px}
.label-m{font:500 12px/16px var(--font-plain);letter-spacing:.4px}
.muted{color:var(--on-surface-variant)}

/* Icônes : Material Symbols Sharp, poids 300 (coins nets, trait fin accordé à la serif) */
.ic{font-family:"Material Symbols Sharp";font-weight:300;font-style:normal;font-size:24px;line-height:1;display:inline-block;width:24px;height:24px;overflow:hidden;white-space:nowrap;direction:ltr;user-select:none;flex:none;font-variation-settings:"FILL" 0,"wght" 300,"GRAD" 0,"opsz" 24}

/* ===== Calque d'état partagé (8 % survol, 10 % focus, 10 % pression) ===== */
.st{position:relative;isolation:isolate;cursor:pointer;-webkit-tap-highlight-color:transparent}
.st::before{content:"";position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:0;z-index:-1;transition:opacity 150ms var(--ease);pointer-events:none}
.st:hover::before,.st.is-hover::before{opacity:.08}
.st:focus-visible::before,.st.is-focus::before{opacity:.10}
.st:active::before,.st.is-pressed::before{opacity:.10}
.is-focus{outline:3px solid var(--primary);outline-offset:2px}

/* ===== 1. Bouton encre ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border:0;border-radius:var(--r-xs);background:transparent;color:var(--primary);font:500 14px/20px var(--font-plain);letter-spacing:.1px;text-decoration:none;white-space:nowrap}
.btn .ic{font-size:20px;width:20px;height:20px;margin-inline-start:-4px}
.btn-fill{background:var(--primary);color:var(--on-primary)}
.btn-fill .ic.trail{margin-inline:0 -6px;transition:transform 200ms var(--ease)}
.btn-fill:hover .ic.trail,.btn-fill.is-hover .ic.trail{transform:translateX(3px)}
.btn-line{color:var(--on-surface);box-shadow:inset 0 0 0 1px var(--outline)}
.btn-text{padding:0 12px}
.btn-danger{color:var(--error)}
.btn:disabled,.btn.is-disabled{cursor:default;color:color-mix(in srgb,var(--on-surface) 38%,transparent);box-shadow:none}
.btn-fill:disabled,.btn-fill.is-disabled{background:color-mix(in srgb,var(--on-surface) 12%,transparent)}
.btn-line:disabled,.btn-line.is-disabled{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--on-surface) 12%,transparent)}
.btn:disabled::before,.btn.is-disabled::before{display:none}

.ib{display:inline-grid;place-items:center;width:48px;height:48px;padding:0;border:0;border-radius:var(--r-xs);background:transparent;color:var(--on-surface-variant);flex:none}
.ib.box{box-shadow:inset 0 0 0 1px var(--outline-variant);color:var(--on-surface)}
.ib:disabled{color:color-mix(in srgb,var(--on-surface) 38%,transparent);cursor:default}
.ib:disabled::before{display:none}

/* ===== 2. Tranche (livre sur l'étagère) ===== */
.shelf{display:flex;align-items:flex-end;gap:6px;min-height:296px;padding:24px 4px 0;border-bottom:3px solid var(--on-surface);overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scroll-padding-inline:8px}
.spine{--h:200px;--sp-bg:var(--sc-high);--sp-fg:var(--on-surface);--sp-sub:var(--on-surface-variant);
  flex:none;width:52px;height:var(--h);margin:0;padding:22px 0 12px;border:0;border-radius:3px 3px 0 0;background:var(--sp-bg);color:var(--sp-fg);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px;text-align:start;
  transition:transform 250ms var(--ease)}
.spine::after{content:"";position:absolute;inset-inline:9px;top:9px;height:5px;border-block:1px solid currentColor;opacity:.45}
.spine .sp-t{writing-mode:vertical-rl;transform:rotate(180deg);font:500 16px/20px var(--font-brand);font-variation-settings:"opsz" 18;max-height:calc(var(--h) - 92px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spine .sp-a{writing-mode:vertical-rl;transform:rotate(180deg);font:500 11px/16px var(--font-plain);letter-spacing:.5px;color:var(--sp-sub);max-height:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spine[data-tone="0"]{--sp-bg:var(--sc-lowest);box-shadow:inset 0 0 0 1px var(--outline-variant)}
.spine[data-tone="1"]{--sp-bg:var(--sc)}
.spine[data-tone="2"]{--sp-bg:var(--sc-high)}
.spine[data-tone="3"]{--sp-bg:var(--sc-highest)}
.spine[data-tone="4"]{--sp-bg:var(--inverse-surface);--sp-fg:var(--inverse-on-surface);--sp-sub:var(--inverse-on-surface)}
.spine.reading{--sp-bg:var(--primary);--sp-fg:var(--on-primary);--sp-sub:var(--on-primary);box-shadow:none}
.spine .sp-x{font-size:18px;width:18px;height:18px;margin-top:-2px}
.spine:hover,.spine.is-hover,.spine:focus-visible,.spine.is-focus{transform:translateY(-8px)}
.spine:focus-visible{outline-offset:3px}
.shelf-empty{align-self:center;margin:auto;padding:24px;color:var(--on-surface-variant);text-align:center}

/* ===== 3. Signet (progression) ===== */
.ribbon{position:relative;padding-top:18px}
.ribbon-track{position:relative;height:2px;background:var(--outline-variant)}
.ribbon-track::after{content:"";position:absolute;inset:-4px 0;background:linear-gradient(90deg,transparent calc(25% - .5px),var(--outline) 0 calc(25% + .5px),transparent 0 calc(50% - .5px),var(--outline) 0 calc(50% + .5px),transparent 0 calc(75% - .5px),var(--outline) 0 calc(75% + .5px),transparent 0)}
.ribbon-fill{height:100%;width:calc(var(--p,0) * 100%);background:var(--primary);transition:width 500ms var(--ease)}
.ribbon-mark{position:absolute;top:2px;left:clamp(0px,calc(var(--p,0) * 100% - 7px),calc(100% - 14px));width:14px;height:34px;background:var(--primary);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);transition:left 500ms var(--ease)}
.ribbon-meta{display:flex;justify-content:space-between;gap:16px;margin-top:22px;font:500 12px/16px var(--font-plain);letter-spacing:.4px;color:var(--on-surface-variant)}
.ribbon-meta b{color:var(--on-surface);font-weight:600}

/* ===== 4. Compteur de page ===== */
.stepper{display:flex;align-items:center;gap:8px}
.stepper-num{display:flex;align-items:baseline;gap:6px;min-width:0}
.stepper input{width:3.4ch;min-width:0;padding:0 0 2px;border:0;border-bottom:1px solid var(--outline);border-radius:0;background:transparent;text-align:center;font:400 45px/52px var(--font-brand);font-variation-settings:"opsz" 60;font-variant-numeric:tabular-nums lining-nums;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.stepper input:focus{outline:none;border-bottom:2px solid var(--primary);padding-bottom:1px}
.stepper input:focus-visible{outline:3px solid var(--primary);outline-offset:4px}
.stepper-of{font:400 16px/24px var(--font-brand);color:var(--on-surface-variant);white-space:nowrap}

/* ===== 5. Minuteur de session ===== */
.timer{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;background:var(--sc-low);border-radius:var(--r-s);box-shadow:inset 0 0 0 1px var(--sc-high)}
.timer-dot{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--outline);flex:none}
.timer-time{font:400 28px/36px var(--font-brand);font-variation-settings:"opsz" 36;font-variant-numeric:tabular-nums lining-nums;flex:1;min-width:0}
.timer-time small{display:block;font:500 12px/16px var(--font-plain);letter-spacing:.4px;color:var(--on-surface-variant)}
.timer[data-state="run"] .timer-dot{background:var(--primary);box-shadow:none;animation:pulse 1.6s var(--ease) infinite}
.timer[data-state="run"]{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--primary) 45%,transparent)}
@keyframes pulse{50%{transform:scale(1.6);opacity:.45}}

/* ===== 6. Traits (note sur 5) ===== */
.traits{border:0;margin:0;padding:0;min-width:0}
.traits legend{padding:0;margin-bottom:4px}
.traits-row{display:flex;align-items:center;flex-wrap:wrap;gap:0}
.trait{position:relative;display:grid;place-items:center;width:44px;height:48px;border-radius:var(--r-xs);color:var(--on-surface)}
.trait input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.trait .bar{width:4px;height:28px;border-radius:1px;background:var(--outline-variant);transform:rotate(14deg);transition:background 150ms var(--ease),height 200ms var(--ease)}
.trait:has(input:checked) .bar,.trait:has(~ .trait input:checked) .bar{background:var(--primary);height:32px}
.trait:has(input:focus-visible){outline:3px solid var(--primary);outline-offset:-2px}
.traits-out{margin-inline-start:12px;font:400 16px/24px var(--font-brand);font-style:italic;color:var(--on-surface-variant)}

/* ===== 7. Fiche citation ===== */
.quote{margin:0;padding:2px 0 2px 20px;border-inline-start:2px solid var(--primary)}
.quote blockquote{margin:0;font:italic 400 20px/30px var(--font-brand);font-variation-settings:"opsz" 24;text-wrap:pretty}
.quote figcaption{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;min-height:48px}
.quote figcaption .label-m{color:var(--on-surface-variant)}
.quote-act{display:flex;opacity:.0;transition:opacity 150ms var(--ease)}
.quote:hover .quote-act,.quote:focus-within .quote-act,.quote.is-hover .quote-act{opacity:1}
@media (hover:none){.quote-act{opacity:1}}

/* ===== 8. Calendrier d'encre ===== */
.ink-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);grid-template-columns:repeat(var(--weeks,20),minmax(0,1fr));gap:3px;max-width:100%}
.ink-grid i{display:block;aspect-ratio:1;border-radius:2px;background:var(--sc-high)}
.ink-grid i[data-l="1"]{background:color-mix(in srgb,var(--primary) 28%,var(--sc-high))}
.ink-grid i[data-l="2"]{background:color-mix(in srgb,var(--primary) 52%,var(--sc-high))}
.ink-grid i[data-l="3"]{background:color-mix(in srgb,var(--primary) 76%,var(--sc-high))}
.ink-grid i[data-l="4"]{background:var(--primary)}
.ink-grid i.today{outline:1.5px solid var(--on-surface);outline-offset:1px}
.ink-grid i.void{background:transparent}
.ink-legend{display:flex;align-items:center;gap:4px;margin-top:12px;font:500 12px/16px var(--font-plain);letter-spacing:.4px;color:var(--on-surface-variant)}
.ink-legend i{width:12px;height:12px;border-radius:2px;display:inline-block}
.ink-legend span:first-child{margin-inline-end:4px}.ink-legend span:last-child{margin-inline-start:4px}

/* ===== 9. Index (navigation) ===== */
.index{display:flex}
.index a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-height:64px;padding:8px 4px;color:var(--on-surface-variant);text-decoration:none;font:500 13px/16px var(--font-plain);letter-spacing:.2px}
.index a .n{font:italic 400 14px/18px var(--font-brand);font-variant-numeric:lining-nums;opacity:.8}
.index a::after{content:"";position:absolute;top:0;inset-inline:28%;height:2px;background:var(--primary);transform:scaleX(0);transition:transform 250ms var(--ease)}
.index a[aria-current="page"]{color:var(--on-surface);font-weight:650}
.index a[aria-current="page"] .n{color:var(--primary);opacity:1}
.index a[aria-current="page"]::after{transform:scaleX(1)}
.index.toc{flex-direction:column;gap:2px}
.index.toc a{flex:none;flex-direction:row;justify-content:flex-start;gap:14px;min-height:48px;padding:0 16px;border-radius:var(--r-xs);font:500 15px/20px var(--font-plain)}
.index.toc a .n{width:20px}
.index.toc a::after{top:12px;bottom:12px;inset-inline:0 auto;width:2px;height:auto;transform:scaleY(0)}
.index.toc a[aria-current="page"]::after{transform:scaleY(1)}

/* ===== Composants Material repris : segmented (onglets), text field, dialog, snackbar ===== */
.seg{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--outline-variant)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;min-height:48px;padding:0 12px;border:0;background:none;border-radius:var(--r-xs) var(--r-xs) 0 0;color:var(--on-surface-variant);font:500 14px/20px var(--font-plain)}
.seg button[aria-pressed="true"]{color:var(--on-surface);box-shadow:inset 0 -2px 0 var(--primary)}
.seg button .c{font:400 13px/16px var(--font-brand);font-style:italic;margin-inline-start:4px;color:var(--on-surface-variant)}

.field{position:relative;display:block}
.field input,.field textarea{display:block;width:100%;min-height:56px;padding:16px;border:1px solid var(--outline);border-radius:var(--r-xs);background:transparent;font:400 16px/24px var(--font-plain);resize:vertical}
.field textarea{min-height:120px;font:italic 400 18px/28px var(--font-brand)}
.field>span{position:absolute;top:-8px;inset-inline-start:12px;padding:0 4px;background:var(--field-bg,var(--surface));font:500 12px/16px var(--font-plain);letter-spacing:.4px;color:var(--on-surface-variant)}
.field input:hover,.field textarea:hover{border-color:var(--on-surface)}
.field input:focus,.field textarea:focus{outline:none;border:2px solid var(--primary);padding:15px}
.field:focus-within>span{color:var(--primary)}
.field small{display:block;padding:4px 16px 0;font:400 12px/16px var(--font-plain);letter-spacing:.4px;color:var(--on-surface-variant)}
.field.err input,.field.err textarea{border-color:var(--error)}
.field.err>span,.field.err small{color:var(--error)}

dialog.dlg{width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 48px);margin:auto;padding:24px;border:0;border-radius:var(--r-s);background:var(--sc-high);color:var(--on-surface);--field-bg:var(--sc-high)}
dialog.dlg::backdrop{background:color-mix(in srgb,var(--scrim) 32%,transparent)}
dialog.dlg[open]{animation:dlgIn 300ms var(--ease-dec)}
@keyframes dlgIn{from{opacity:0;transform:translateY(12px)}}
.dlg h2{margin-bottom:16px}
.dlg form>.stack{display:grid;gap:24px;padding-top:8px}
.dlg .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dlg .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}

.snack{position:fixed;inset-inline:16px;bottom:16px;z-index:50;display:flex;align-items:center;gap:8px;max-width:560px;margin-inline:auto;min-height:48px;padding:4px 4px 4px 16px;border-radius:var(--r-xs);background:var(--inverse-surface);color:var(--inverse-on-surface);font:400 14px/20px var(--font-plain);transform:translateY(16px);opacity:0;visibility:hidden;transition:transform 250ms var(--ease-dec),opacity 200ms var(--ease),visibility 0s 250ms}
.snack.on{transform:none;opacity:1;visibility:visible;transition:transform 300ms var(--ease-dec),opacity 200ms var(--ease)}
.snack p{flex:1;padding:10px 0}
.snack .btn{color:var(--inverse-primary)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
  .spine:hover,.spine:focus-visible{transform:none}
}


/* ===== Application ===== */
.mark{display:flex;align-items:center;gap:12px;min-height:48px;font:italic 500 26px/32px var(--font-brand);text-decoration:none;color:var(--on-surface)}
.mark::before{content:"";width:2px;height:28px;background:var(--primary)}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 4px 0 16px;background:var(--surface);border-bottom:1px solid var(--sc-high)}
.topbar-act{display:flex}
.side{display:none}
main{display:block;max-width:1180px;margin:0 auto;padding:24px 16px 128px;min-width:0}
main:focus{outline:none}
.bottom{position:fixed;inset-inline:0;bottom:0;z-index:10;background:var(--sc-low);border-top:1px solid var(--outline-variant);padding-bottom:env(safe-area-inset-bottom)}
.snack{bottom:88px}
.snack [hidden]{display:none}
.kicker{display:block;font:500 12px/16px var(--font-plain);letter-spacing:.4px;color:var(--on-surface-variant)}
.view-h{display:grid;gap:8px;margin-bottom:32px}
.view-h h1{font:400 32px/40px var(--font-brand);letter-spacing:-.25px;font-variation-settings:"opsz" 48}
h1:focus{outline:none}

.sec-h{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.sec-h h2{font:400 24px/32px var(--font-brand);font-variation-settings:"opsz" 30}

/* Étagère */
.hero{display:grid;gap:24px;padding-bottom:48px}
.hero-main{display:grid;gap:20px;min-width:0}
.hero-t{display:grid;gap:4px}
.hero-t h1{font:400 36px/44px var(--font-brand);letter-spacing:-.25px;font-variation-settings:"opsz" 60;text-wrap:balance}
.author{font:italic 400 20px/28px var(--font-brand);color:var(--on-surface-variant)}
.hero-act{display:flex;flex-wrap:wrap;gap:8px}
.week{display:grid;gap:12px;align-content:start;padding:20px;border-radius:var(--r-s);background:var(--sc-low)}
.week .big{font:400 57px/60px var(--font-brand);font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.5px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk i{aspect-ratio:1;border-radius:2px;background:var(--sc-high)}
.wk i[data-l="1"]{background:color-mix(in srgb,var(--primary) 28%,var(--sc-high))}
.wk i[data-l="2"]{background:color-mix(in srgb,var(--primary) 52%,var(--sc-high))}
.wk i[data-l="3"]{background:color-mix(in srgb,var(--primary) 76%,var(--sc-high))}
.wk i[data-l="4"]{background:var(--primary)}
.wk span{text-align:center;font:500 11px/16px var(--font-plain);color:var(--on-surface-variant)}
.shelf-wrap{display:grid;gap:16px}
.shelf-note{font:400 12px/16px var(--font-plain);letter-spacing:.4px;color:var(--on-surface-variant)}
.empty{display:grid;gap:12px;justify-items:start;padding:24px;border-radius:var(--r-s);background:var(--sc-low)}
.empty p{max-width:52ch;color:var(--on-surface-variant)}

/* Livre */
.book{display:grid;gap:40px}
.book-h{display:grid;gap:8px}
.book-h .top{display:flex;align-items:center;gap:4px;margin:-8px 0 8px -12px}
.book-h h1{font:400 36px/44px var(--font-brand);letter-spacing:-.25px;font-variation-settings:"opsz" 60;text-wrap:balance}
.pane{display:grid;gap:32px;align-content:start;min-width:0}
.paper{padding:24px 20px;border-radius:var(--r-s);background:var(--sc-low)}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;font:400 14px/20px var(--font-plain);color:var(--on-surface-variant)}
.meta b{color:var(--on-surface);font-weight:500}
.finish .ribbon-mark{animation:ribbonIn 750ms var(--ease-spring)}
@keyframes ribbonIn{0%{transform:translateY(-14px);opacity:0}}
.quotes{display:grid;gap:24px}
.danger-zone{padding-top:8px;border-top:1px solid var(--sc-high)}

/* Citations */
.q-group{display:grid;gap:20px;padding:32px 0;border-top:1px solid var(--outline-variant)}
.q-group h2{font:400 22px/28px var(--font-brand)}
.q-group h2 a{color:inherit;text-decoration:underline;text-decoration-color:var(--outline-variant);text-underline-offset:5px}
.q-group h2 a:hover{text-decoration-color:var(--primary)}
.q-group .author{font-size:16px;line-height:24px}

/* Carnet */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-bottom:40px;border-radius:var(--r-s);overflow:hidden;background:var(--sc-high);box-shadow:0 0 0 1px var(--sc-high)}
.stat{display:grid;gap:4px;align-content:start;padding:20px 16px;background:var(--surface)}
.stat b{font:400 45px/52px var(--font-brand);font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.5px}
.stat span{font:400 14px/20px var(--font-plain);color:var(--on-surface-variant)}
.stat:first-child{background:var(--sc-lowest)}
.stat:first-child b{color:var(--primary)}
.ink-card{padding:24px 20px;border-radius:var(--r-s);background:var(--sc-low);margin-bottom:40px}
.ink-card .sec-h{margin-bottom:16px}
.done-list{list-style:none;margin:0;padding:0}
.done-list li{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--sc-high)}
.done-list a{display:block;padding:6px 0;color:var(--on-surface);text-decoration:none;font:400 20px/28px var(--font-brand)}
.done-list a:hover{text-decoration:underline;text-decoration-color:var(--primary);text-underline-offset:5px}
.done-list small{display:block;font:400 14px/20px var(--font-plain);color:var(--on-surface-variant)}
.mini-traits{display:flex;gap:6px;align-items:center}
.mini-traits i{width:3px;height:18px;border-radius:1px;background:var(--outline-variant);transform:rotate(14deg)}
.mini-traits i.on{background:var(--primary)}

/* Dialogs */
.radio-seg{display:flex;border:1px solid var(--outline);border-radius:var(--r-xs);overflow:hidden}
.radio-seg label{flex:1;position:relative;display:grid;place-items:center;min-height:48px;padding:0 8px;font:500 14px/20px var(--font-plain);cursor:pointer;color:var(--on-surface-variant)}
.radio-seg label+label{border-inline-start:1px solid var(--outline)}
.radio-seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.radio-seg label:has(input:checked){background:var(--sc-highest);color:var(--on-surface);box-shadow:inset 0 -2px 0 var(--primary)}
.radio-seg label:has(input:focus-visible){outline:3px solid var(--primary);outline-offset:-3px}
.radio-seg.wide{background:var(--surface)}
.dlg .radio-seg{background:transparent}

/* Moyen : la table des matières passe à gauche, filet cobalt de marge */
@media (min-width:600px){
  .topbar,.bottom{display:none}
  .snack{bottom:16px}
  .app{display:grid;grid-template-columns:216px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:32px;position:sticky;top:0;height:100vh;height:100dvh;padding:20px 12px 24px;background:var(--sc-low);border-inline-end:1px solid color-mix(in srgb,var(--primary) 55%,transparent)}
  .side .mark{padding-inline-start:16px}
  .side .foot{margin-top:auto;display:grid;gap:8px;justify-items:start;padding-inline-start:4px}
  main{padding:40px 32px 80px;width:100%}
  .hero-t h1,.book-h h1{font-size:45px;line-height:52px}
  .stats{grid-template-columns:repeat(4,1fr)}
}
/* Étendu : composition en colonnes */
@media (min-width:840px){
  .app{grid-template-columns:264px minmax(0,1fr)}
  main{padding:56px 56px 96px}
  .hero{grid-template-columns:minmax(0,1fr) 300px;column-gap:48px;align-items:end}
  .hero-t h1{font-size:57px;line-height:64px;letter-spacing:-.5px}
  .book{grid-template-columns:minmax(0,6fr) minmax(0,5fr);column-gap:48px;row-gap:40px}
  .book-h{grid-column:1/-1}
  .paper{padding:28px}
  .stat{padding:24px}
  .stat b{font-size:57px;line-height:64px}
  .q-wrap{columns:2;column-gap:48px}
  .q-wrap .q-group{break-inside:avoid}
}
</style>

      <fieldset style="border:0;margin:0;padding:0;min-width:0"><legend class="label-m muted" style="margin-bottom:8px">Où le ranger ?</legend>
        <div class="radio-seg"><label><input type="radio" name="status" value="todo" checked>À lire</label><label><input type="radio" name="status" value="reading">En cours</label><label><input type="radio" name="status" value="done">Lu</label></div>

<div class="snack" id="snack" role="status" aria-live="polite"><p id="snackT"></p><button class="btn btn-text st" id="snackA" hidden>Annuler</button></div>

<script>
(()=>{
const KEY='marge.v1', root=document.documentElement, $=s=>document.querySelector(s), main=$('#main');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dayKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dayKey(new Date());
const daysAgo=n=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-n);return d};
const fmtN=n=>n.toLocaleString('fr-FR');
const fmtDate=k=>new Date(k+'T12:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long'});
const uid=()=>Math.random().toString(36).slice(2,9);

/* ---------- Données ---------- */
function seed(){
  const B=(title,author,pages,status,page,extra={})=>({id:uid(),title,author,pages,status,page,rating:0,minutes:0,quotes:[],started:dayKey(daysAgo(12)),finished:null,touched:0,...extra});
  const Q=(text,page)=>({id:uid(),text,page,at:Date.now()});
  const books=[
    B("L'Écume des jours",'Boris Vian',320,'reading',132,{minutes:214,touched:Date.now()}),
    B('Madame Bovary','Gustave Flaubert',480,'todo',0),
    B("L'Étranger",'Albert Camus',184,'done',184,{rating:5,minutes:260,finished:dayKey(daysAgo(70)),quotes:[Q("Aujourd'hui, maman est morte. Ou peut-être hier, je ne sais pas.",9)]}),
    B('Bonjour tristesse','Françoise Sagan',160,'todo',0),
    B('Vingt mille lieues sous les mers','Jules Verne',512,'done',512,{rating:4,minutes:640,finished:dayKey(daysAgo(120)),quotes:[Q('Mobilis in mobili.',88)]}),
    B('La Peste','Albert Camus',352,'done',352,{rating:4,minutes:410,finished:dayKey(daysAgo(30)),quotes:[Q("Il y a dans les hommes plus de choses à admirer que de choses à mépriser.",351)]}),
    B('Le Comte de Monte-Cristo','Alexandre Dumas',1250,'todo',0),
    B('Le Rouge et le Noir','Stendhal',576,'done',576,{rating:3,minutes:700,finished:dayKey(daysAgo(160)),quotes:[Q('Un roman est un miroir qui se promène sur une grande route.',412)]}),
    B('Le Petit Prince','Antoine de Saint-Exupéry',96,'done',96,{rating:5,minutes:95,finished:dayKey(daysAgo(52)),quotes:[Q("On ne voit bien qu'avec le cœur. L'essentiel est invisible pour les yeux.",72)]}),
  ];
  const log={};let s=11;const rnd=()=>(s=(s*9301+49297)%233280)/233280;
  for(let i=1;i<380;i++){const r=rnd();if(r<.62){const p=Math.round(6+rnd()*48);log[dayKey(daysAgo(i))]={p,m:Math.round(p*1.6)};}}
  for(let i=1;i<=6;i++){const p=Math.round(12+rnd()*30);log[dayKey(daysAgo(i))]={p,m:Math.round(p*1.6)};}
  return {books,log,filter:'all'};
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.books)){S=seed();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const book=id=>S.books.find(b=>b.id===id);
const addLog=(p,m)=>{const k=today();const e=S.log[k]||{p:0,m:0};e.p+=p;e.m+=m;S.log[k]=e;};
const level=p=>!p?0:p<12?1:p<25?2:p<40?3:4;
const STATUS={reading:'En cours',todo:'À lire',done:'Lu'};
const tone=id=>[0,1,2,3,2,1,4,3][[...id].reduce((a,c)=>a+c.charCodeAt(0),0)%8];
const spineH=p=>Math.round(196+Math.min(84,Math.sqrt(p/1250)*84));
const current=()=>S.books.filter(b=>b.status==='reading').sort((a,b)=>(b.touched||0)-(a.touched||0))[0];

/* ---------- Thème ---------- */
try{const t=localStorage.getItem('marge.theme');if(t)root.dataset.theme=t;}catch(e){}
const isDark=()=>root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
const themeLabel=()=>document.querySelectorAll('.theme-l').forEach(e=>e.textContent=isDark()?'Thème clair':'Thème sombre');
themeLabel();

/* ---------- Snackbar ---------- */
let snT=0,undoFn=null;
function snack(msg,undo){$('#snackT').textContent=msg;undoFn=undo||null;$('#snackA').hidden=!undo;$('#snack').classList.add('on');clearTimeout(snT);snT=setTimeout(()=>$('#snack').classList.remove('on'),undo?6000:4000);}
$('#snackA').onclick=()=>{if(undoFn){undoFn();undoFn=null;save();render();}$('#snack').classList.remove('on');};

/* ---------- Composants (identiques à la planche) ---------- */
const ribbonHTML=(b,cls='')=>{const p=b.pages?Math.min(1,b.page/b.pages):0;
  return `<div class="ribbon ${cls}" style="--p:${p}" role="progressbar" aria-valuemin="0" aria-valuemax="${b.pages}" aria-valuenow="${b.page}" aria-valuetext="page ${b.page} sur ${b.pages}, ${Math.round(p*100)} %"><div class="ribbon-track"><div class="ribbon-fill"></div></div><div class="ribbon-mark"></div><div class="ribbon-meta"><span>Page <b class="num">${fmtN(b.page)}</b> sur ${fmtN(b.pages)}</span><span class="num">${p>=1?'Terminé':Math.round(p*100)+' %'}</span></div></div>`;};
const spineHTML=b=>{const lab=`${b.title}, ${b.author||'auteur inconnu'}, ${STATUS[b.status].toLowerCase()}${b.status==='reading'?`, page ${b.page} sur ${b.pages}`:''}`;
  return `<a class="spine st ${b.status==='reading'?'reading':''}" data-tone="${tone(b.id)}" style="--h:${spineH(b.pages)}px" href="#/livre/${b.id}" aria-label="${esc(lab)}"><span class="sp-t">${esc(b.title)}</span><span class="sp-a">${esc(b.author)}</span>${b.status==='done'?'<span class="ic sp-x" aria-hidden="true">check</span>':''}</a>`;};
const quoteHTML=(b,q,showTitle)=>`<figure class="quote"><blockquote>« ${esc(q.text)} »</blockquote><figcaption><span class="label-m">${q.page!=null&&q.page!==''?'p. '+esc(q.page):'Sans page'}${showTitle?' · '+esc(b.title):''}</span><span class="quote-act"><button class="ib st" data-act="copy" data-b="${b.id}" data-q="${q.id}" aria-label="Copier la citation"><span class="ic" aria-hidden="true">content_copy</span></button><button class="ib st" data-act="delq" data-b="${b.id}" data-q="${q.id}" aria-label="Supprimer la citation"><span class="ic" aria-hidden="true">delete</span></button></span></figcaption></figure>`;
const miniTraits=r=>`<span class="mini-traits" role="img" aria-label="${r?r+' sur 5':'Pas encore noté'}">${[1,2,3,4,5].map(i=>`<i class="${i<=r?'on':''}"></i>`).join('')}</span>`;

/* ---------- Navigation ---------- */
const NAV=[['etagere','Étagère'],['citations','Citations'],['carnet','Carnet']];
function navHTML(cur){return NAV.map(([k,l],i)=>`<a class="st" href="#/${k}" ${cur===k?'aria-current="page"':''}><span class="n">0${i+1}</span>${l}</a>`).join('');}

/* ---------- Vues ---------- */
function vShelf(){
  const c=current();
  const wk=[];let wp=0;for(let i=6;i>=0;i--){const d=daysAgo(i);const e=S.log[dayKey(d)];const p=e?e.p:0;wp+=p;wk.push([p,d.toLocaleDateString('fr-FR',{weekday:'narrow'})]);}
  const counts={all:S.books.length,reading:0,todo:0,done:0};S.books.forEach(b=>counts[b.status]++);
  const order={reading:0,todo:1,done:2};
  const list=S.books.filter(b=>S.filter==='all'||b.status===S.filter).sort((a,b)=>order[a.status]-order[b.status]);
  const hero=c?`<div class="hero-main">
      <div class="hero-t"><span class="kicker">Reprendre · page ${c.page}</span><h1 tabindex="-1">${esc(c.title)}</h1><p class="author">${esc(c.author)}</p></div>
      ${ribbonHTML(c)}
      <div class="hero-act"><a class="btn btn-fill st" href="#/livre/${c.id}">Reprendre la lecture<span class="ic trail" aria-hidden="true">arrow_forward</span></a><button class="btn btn-text st" data-act="plus" data-b="${c.id}" data-n="10">J'ai lu 10 pages</button></div>
    </div>`:`<div class="hero-main"><div class="hero-t"><span class="kicker">Aucune lecture en cours</span><h1 tabindex="-1">Quel livre ouvrir ?</h1></div><p class="body-l muted" style="max-width:48ch">Choisissez un livre sur l'étagère et passez-le en cours, ou ajoutez-en un nouveau.</p><div class="hero-act"><button class="btn btn-fill st" data-act="add">Ajouter un livre<span class="ic trail" aria-hidden="true">arrow_forward</span></button></div></div>`;
  return `<section class="hero" aria-label="Lecture en cours">${hero}
    <aside class="week" aria-label="Cette semaine"><span class="kicker">Ces 7 derniers jours</span><b class="big">${fmtN(wp)}</b><span class="body-m muted">pages lues</span>
      <div class="wk" role="img" aria-label="Lecture sur 7 jours : ${wk.filter(x=>x[0]).length} jours avec au moins une page">${wk.map(x=>`<i data-l="${level(x[0])}"></i>`).join('')}${wk.map(x=>`<span aria-hidden="true">${x[1]}</span>`).join('')}</div></aside>
  </section>
  <section class="shelf-wrap" aria-labelledby="shelfH">
    <div class="sec-h"><h2 id="shelfH">Mon étagère</h2></div>
    <div class="seg" role="group" aria-label="Filtrer l'étagère">${[['all','Tous'],['reading','En cours'],['todo','À lire'],['done','Lus']].map(([k,l])=>`<button class="st" data-act="filter" data-f="${k}" aria-pressed="${S.filter===k}">${l}<span class="c">${counts[k]}</span></button>`).join('')}</div>
    <div class="shelf" role="list" aria-label="Livres">${list.length?list.map(b=>`<div role="listitem" style="display:contents">${spineHTML(b)}</div>`).join(''):`<p class="shelf-empty">Rien sur cette planche pour l'instant.</p>`}</div>
    <p class="shelf-note">La hauteur d'une tranche suit le nombre de pages. En bleu, le livre en cours ; une coche au pied, un livre lu.</p>
  </section>`;
}

let timer=null; // {id,t0}
function vBook(id,finished){
  const b=book(id);if(!b)return `<div class="view-h"><h1 tabindex="-1">Livre introuvable</h1></div><a class="btn btn-line st" href="#/etagere">Revenir à l'étagère</a>`;
  const run=timer&&timer.id===b.id;
  const qs=[...b.quotes].sort((x,y)=>(+x.page||0)-(+y.page||0));
  return `<article class="book">
    <header class="book-h"><div class="top"><a class="ib st" href="#/etagere" aria-label="Retour à l'étagère"><span class="ic" aria-hidden="true">arrow_back</span></a><span class="kicker">${STATUS[b.status]} · ${fmtN(b.pages)} pages</span></div>
      <h1 tabindex="-1">${esc(b.title)}</h1><p class="author">${esc(b.author)}</p></header>
    <section class="pane" aria-label="Progression">
      <div class="radio-seg wide" role="radiogroup" aria-label="État du livre">${['todo','reading','done'].map(k=>`<label><input type="radio" name="st" value="${k}" data-act="status" data-b="${b.id}" ${b.status===k?'checked':''}>${STATUS[k]}</label>`).join('')}</div>
      <div class="stepper"><button class="ib box st" data-act="step" data-b="${b.id}" data-n="-1" aria-label="Page précédente" ${b.page<=0?'disabled':''}><span class="ic" aria-hidden="true">remove</span></button>
        <div class="stepper-num"><label class="sr" for="pg">Page actuelle</label><input id="pg" data-b="${b.id}" type="number" inputmode="numeric" min="0" max="${b.pages}" value="${b.page}"><span class="stepper-of">/ ${fmtN(b.pages)} p.</span></div>
        <button class="ib box st" data-act="step" data-b="${b.id}" data-n="1" aria-label="Page suivante" ${b.page>=b.pages?'disabled':''}><span class="ic" aria-hidden="true">add</span></button></div>
      ${ribbonHTML(b,finished?'finish':'')}
      <div class="timer" data-state="${run?'run':'idle'}"><span class="timer-dot" aria-hidden="true"></span><span class="timer-time num"><small>${run?'En lecture':'Session'}</small><span id="tmT">${run?clock():'00:00'}</span></span>${run?`<button class="btn btn-fill st" data-act="timer" data-b="${b.id}">Terminer</button>`:`<button class="btn btn-line st" data-act="timer" data-b="${b.id}" style="background:var(--sc-lowest)">Démarrer</button>`}</div>
      ${b.status==='done'?`<fieldset class="traits"><legend class="label-l" style="margin-bottom:4px">Votre note</legend><div class="traits-row">${[1,2,3,4,5].map(i=>`<label class="trait st"><input type="radio" name="note" value="${i}" data-act="rate" data-b="${b.id}" ${b.rating===i?'checked':''}><span class="bar" aria-hidden="true"></span><span class="sr">${i} sur 5</span></label>`).join('')}<output class="traits-out">${b.rating?b.rating+' sur 5':'Pas encore noté'}</output></div></fieldset>`:''}
      <p class="meta"><span>Temps de lecture <b class="num">${fmtDur(b.minutes)}</b></span>${b.finished?`<span>Terminé le <b>${fmtDate(b.finished)}</b></span>`:''}</p>
      <div class="danger-zone"><button class="btn btn-text btn-danger st" data-act="delbook" data-b="${b.id}" style="margin-inline-start:-12px">Retirer de l'étagère</button></div>
    </section>
    <section class="pane paper" aria-labelledby="qH">
      <div class="sec-h"><h2 id="qH">Dans la marge <span class="muted" style="font-style:italic">· ${b.quotes.length}</span></h2><button class="btn btn-line st" data-act="addq" data-b="${b.id}" style="background:var(--sc-lowest)"><span class="ic" aria-hidden="true">add</span>Citation</button></div>
      ${qs.length?`<div class="quotes">${qs.map(q=>quoteHTML(b,q)).join('')}</div>`:`<p class="body-m muted" style="max-width:44ch">Aucune citation. Quand une phrase vous arrête, recopiez-la ici avec sa page.</p>`}
    </section>
  </article>`;
}
const fmtDur=m=>m<60?m+' min':Math.floor(m/60)+' h '+pad(m%60);
const clock=()=>{const s=Math.floor((Date.now()-timer.t0)/1000);return (s>=3600?Math.floor(s/3600)+':':'')+pad(Math.floor(s/60)%60)+':'+pad(s%60);};

function vQuotes(){
  const withQ=S.books.filter(b=>b.quotes.length);const n=withQ.reduce((a,b)=>a+b.quotes.length,0);
  return `<header class="view-h"><span class="kicker">${n} citation${n>1?'s':''} · ${withQ.length} livre${withQ.length>1?'s':''}</span><h1 tabindex="-1">Citations</h1></header>
  ${n?`<div class="q-wrap">${withQ.map(b=>`<section class="q-group" aria-label="${esc(b.title)}"><div><h2><a href="#/livre/${b.id}">${esc(b.title)}</a></h2><p class="author">${esc(b.author)}</p></div>${b.quotes.map(q=>quoteHTML(b,q)).join('')}</section>`).join('')}</div>`
  :`<div class="empty"><p>Les phrases que vous notez dans vos livres se rassemblent ici.</p><a class="btn btn-line st" href="#/etagere">Ouvrir l'étagère</a></div>`}`;
}

function vJournal(){
  const now=new Date(),ym=now.getFullYear()+'-'+pad(now.getMonth()+1),yr=String(now.getFullYear());
  let mp=0,mm=0;for(const[k,e]of Object.entries(S.log))if(k.startsWith(ym)){mp+=e.p;mm+=e.m;}
  const doneY=S.books.filter(b=>b.status==='done'&&b.finished&&b.finished.startsWith(yr)).sort((a,b)=>b.finished.localeCompare(a.finished));
  let streak=0;for(let i=S.log[today()]?0:1;;i++){if(S.log[dayKey(daysAgo(i))])streak++;else break;}
  return `<header class="view-h"><span class="kicker">${now.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</span><h1 tabindex="-1">Carnet</h1></header>
  <div class="stats">
    <div class="stat"><b>${fmtN(mp)}</b><span>pages ce mois-ci</span></div>
    <div class="stat"><b>${streak}</b><span>jour${streak>1?'s':''} d'affilée</span></div>
    <div class="stat"><b>${doneY.length}</b><span>livre${doneY.length>1?'s':''} fini${doneY.length>1?'s':''} en ${yr}</span></div>
    <div class="stat"><b>${Math.round(mm/60)}<small style="font-size:.5em;line-height:0"> h</small></b><span>de lecture ce mois-ci</span></div>
  </div>
  <section class="ink-card" aria-labelledby="inkH"><div class="sec-h"><h2 id="inkH">Calendrier d'encre</h2><span class="label-m muted" id="inkW"></span></div><div class="ink" id="ink"></div></section>
  <section aria-labelledby="doneH"><div class="sec-h"><h2 id="doneH">Terminés en ${yr}</h2></div>
    ${doneY.length?`<ul class="done-list">${doneY.map(b=>`<li><div><a href="#/livre/${b.id}">${esc(b.title)}</a><small>${esc(b.author)} · ${fmtDate(b.finished)}</small></div>${miniTraits(b.rating)}</li>`).join('')}</ul>`:`<p class="body-m muted">Aucun livre terminé cette année.</p>`}
  </section>`;
}
function drawInk(){
  const el=$('#ink');if(!el)return;const w=el.clientWidth,weeks=w<420?18:w<640?30:52;el.dataset.k=weeks;
  const end=new Date();end.setHours(12,0,0,0);const dow=(end.getDay()+6)%7;// lundi = 0
  const start=new Date(end);start.setDate(end.getDate()-dow-(weeks-1)*7);
  let days=0,pages=0;const cells=[];
  for(let i=0;i<weeks*7;i++){const d=new Date(start);d.setDate(start.getDate()+i);if(d>end){cells.push('<i class="void"></i>');continue;}
    const e=S.log[dayKey(d)];const p=e?e.p:0;if(p){days++;pages+=p;}cells.push(`<i data-l="${level(p)}"${dayKey(d)===today()?' class="today"':''}></i>`);}
  $('#inkW').textContent=weeks+' dernières semaines';
  el.innerHTML=`<div class="ink-grid" style="--weeks:${weeks}" role="img" aria-label="${weeks} dernières semaines : ${days} jours de lecture, ${fmtN(pages)} pages">${cells.join('')}</div><div class="ink-legend" aria-hidden="true"><span>Moins</span>${[0,28,52,76,100].map(m=>`<i style="background:${m?`color-mix(in srgb,var(--primary) ${m}%,var(--sc-high))`:'var(--sc-high)'}"></i>`).join('')}<span>Plus</span></div>`;
}
new ResizeObserver(()=>{const el=$('#ink');if(!el)return;const w=el.clientWidth,k=w<420?18:w<640?30:52;if(String(k)!==el.dataset.k)drawInk();}).observe(main);

/* ---------- Routeur ---------- */
let first=true,lastRoute='';
function render(opts={}){
  const h=location.hash.replace(/^#\/?/,'')||'etagere';const [r,id]=h.split('/');
  const sec=r==='livre'?'etagere':(NAV.some(n=>n[0]===r)?r:'etagere');
  $('#tocNav').innerHTML=navHTML(sec);$('#barNav').innerHTML=navHTML(sec);
  main.innerHTML=r==='livre'?vBook(id,opts.finished):r==='citations'?vQuotes():r==='carnet'?vJournal():vShelf();
  document.title=r==='livre'&&book(id)?book(id).title+' · Marge':'Marge';
  if(r==='carnet')drawInk();
  if(!first&&h!==lastRoute){const t=main.querySelector('h1');t&&t.focus({preventScroll:true});window.scrollTo(0,0);}
  if(opts.focus){const t=main.querySelector(opts.focus);t&&t.focus();}
  first=false;lastRoute=h;
}
addEventListener('hashchange',()=>render());

/* ---------- Actions ---------- */
function setPage(b,n){
  n=Math.max(0,Math.min(b.pages,Math.round(n)||0));const d=n-b.page;if(!d)return false;
  if(d>0)addLog(d,0);b.page=n;b.touched=Date.now();
  if(b.status==='todo'&&n>0){b.status='reading';b.started=today();}
  if(n>=b.pages&&b.status!=='done'){b.status='done';b.finished=today();save();render({finished:true,focus:'.trait input'});snack(`« ${b.title} » terminé. Donnez-lui une note.`);return true;}
  save();return false;
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,b=t.dataset.b&&book(t.dataset.b);
  if(a==='theme'){root.dataset.theme=isDark()?'light':'dark';try{localStorage.setItem('marge.theme',root.dataset.theme)}catch(_){}themeLabel();}
  else if(a==='add')openBook();
  else if(a==='filter'){S.filter=t.dataset.f;save();render({focus:`[data-f="${t.dataset.f}"]`});}
  else if(a==='plus'&&b){if(!setPage(b,b.page+ +t.dataset.n)){render({focus:'[data-act="plus"]'});snack(`Page ${b.page} notée.`);}}
  else if(a==='step'&&b){if(!setPage(b,b.page+ +t.dataset.n))render({focus:`[data-act="step"][data-n="${t.dataset.n}"]:not(:disabled)`});}
  else if(a==='timer'&&b){
    if(timer&&timer.id===b.id){const m=Math.max(1,Math.round((Date.now()-timer.t0)/60000));timer=null;b.minutes+=m;addLog(0,m);b.touched=Date.now();save();render({focus:'[data-act="timer"]'});snack(`Session de ${m} min enregistrée. Pensez à noter votre page.`);}
    else{if(timer){const o=book(timer.id);if(o){const m=Math.max(1,Math.round((Date.now()-timer.t0)/60000));o.minutes+=m;addLog(0,m);}}
      timer={id:b.id,t0:Date.now()};if(b.status!=='reading'&&b.status!=='done'){b.status='reading';}b.touched=Date.now();save();render({focus:'[data-act="timer"]'});snack('Session démarrée.');}
  }
  else if(a==='addq'&&b)openQuote(b);
  else if(a==='copy'&&b){const q=b.quotes.find(x=>x.id===t.dataset.q);try{navigator.clipboard.writeText(`« ${q.text} » ${b.author}, ${b.title}${q.page?', p. '+q.page:''}`).then(()=>snack('Citation copiée.'),()=>snack('Copie impossible dans ce navigateur.'));}catch(_){snack('Copie impossible dans ce navigateur.');}}
  else if(a==='delq'&&b){const i=b.quotes.findIndex(x=>x.id===t.dataset.q);const [q]=b.quotes.splice(i,1);save();render();snack('Citation supprimée.',()=>b.quotes.splice(i,0,q));}
  else if(a==='delbook'&&b){const i=S.books.indexOf(b);S.books.splice(i,1);if(timer&&timer.id===b.id)timer=null;save();location.hash='#/etagere';snack(`« ${b.title} » retiré de l'étagère.`,()=>S.books.splice(i,0,b));}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='pg'){const b=book(t.dataset.b);if(!setPage(b,+t.value))render({focus:'#pg'});}
  else if(t.dataset.act==='status'){const b=book(t.dataset.b);b.status=t.value;b.touched=Date.now();
    if(t.value==='done'){b.finished=b.finished||today();if(b.page<b.pages){addLog(b.pages-b.page,0);b.page=b.pages;}}
    else b.finished=null;
    save();render({focus:`[data-act="status"][value="${t.value}"]`});}
  else if(t.dataset.act==='rate'){const b=book(t.dataset.b);b.rating=+t.value;save();t.closest('.traits-row').querySelector('output').textContent=t.value+' sur 5';}
});
setInterval(()=>{const el=$('#tmT');if(el&&timer)el.textContent=clock();},1000);

/* ---------- Dialogs ---------- */
const dB=$('#dlgBook'),dQ=$('#dlgQuote');let qBook=null;
function openBook(){const f=dB.querySelector('form');f.reset();['#fT','#fP'].forEach(s=>$(s).classList.remove('err'));$('#fTm').hidden=true;dB.showModal();}
dB.querySelector('form').addEventListener('submit',e=>{
  if(e.submitter&&e.submitter.value==='cancel')return;
  const f=e.target,title=f.title.value.trim(),pages=parseInt(f.pages.value,10);let ok=true;
  $('#fT').classList.toggle('err',!title);$('#fTm').hidden=!!title;f.title.setAttribute('aria-invalid',!title);
  const pOk=pages>=1&&pages<=5000;$('#fP').classList.toggle('err',!pOk);f.pages.setAttribute('aria-invalid',!pOk);
  if(!title||!pOk){e.preventDefault();(!title?f.title:f.pages).focus();return;}
  const st=f.status.value;const b={id:uid(),title,author:f.author.value.trim(),pages,status:st,page:st==='done'?pages:0,rating:0,minutes:0,quotes:[],started:today(),finished:st==='done'?today():null,touched:Date.now()};
  S.books.push(b);S.filter='all';save();setTimeout(()=>{location.hash='#/livre/'+b.id;snack(`« ${title} » rangé sur l'étagère.`);},0);
});
function openQuote(b){qBook=b;const f=dQ.querySelector('form');f.reset();f.page.value=b.page||'';$('#fQ').classList.remove('err');$('#fQm').hidden=true;dQ.showModal();}
dQ.querySelector('form').addEventListener('submit',e=>{
  if(e.submitter&&e.submitter.value==='cancel')return;
  const f=e.target,text=f.text.value.trim().replace(/^«\s*|\s*»$/g,'');
  if(text.length<3){e.preventDefault();$('#fQ').classList.add('err');$('#fQm').hidden=false;f.text.setAttribute('aria-invalid','true');f.text.focus();return;}
  qBook.quotes.push({id:uid(),text,page:f.page.value===''?null:+f.page.value,at:Date.now()});save();setTimeout(()=>{render({focus:'[data-act="addq"]'});snack('Citation ajoutée dans la marge.');},0);
});

render();
})();
</script>
